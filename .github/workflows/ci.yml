name: CI

# 仅用于在自己的 fork 里测试编译，不要合并到上游
on:
  push:
    branches:
      - 'test/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 没有 keystore.properties 时，debug 包使用默认调试签名
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OneUIX-Debug-test
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 15
